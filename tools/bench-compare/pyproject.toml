[project]
name = "polyglot-bench-compare"
version = "0.0.0"
description = "Benchmark environment for parser performance comparisons."
requires-python = ">=3.10"
# Pin comparison libraries so every benchmark uses the same released versions.
dependencies = [
    "polyglot-sql",
    "moz-sql-parser==4.40.21126",
    "pyperf>=2.7.0",
    "sqloxide==0.61.1",
    "sqlfluff==4.5.0",
    "sqlglot[c]==30.27.0",
    "sqlparse==0.6.1",
    "sqltree==0.3.0",
]

[tool.uv.sources]
polyglot-sql = { path = "../../crates/polyglot-sql-python", editable = true }
